name: Pre Merge Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  gradle:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    env:
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Cache Gradle Caches
        uses: gradle/gradle-build-action@v2
      - name: Configure JDK 8 toolchain
        id: jdk8
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 8
      - name: Configure JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17
      - name: Run Gradle tasks
        # Gradle 9 runs on 17. The plugin still compiles with the Java 8 toolchain.
        run: ./gradlew preMerge --continue "-Porg.gradle.java.installations.paths=${{ steps.jdk8.outputs.path }}"
