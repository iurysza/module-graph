[versions]
detekt = "1.23.8"
kotlin = "2.4.21"
kotlinSerializationJson = "1.11.0"
ktlintGradle = "14.2.0"
pluginPublish = "1.3.0"
versionCheck = "0.66.0"

[plugins]
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt"}
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin"}
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle"}
pluginPublish = { id = "com.gradle.plugin-publish", version.ref = "pluginPublish"}
versionCheck = { id = "com.github.ben-manes.versions", version.ref = "versionCheck"}
testKit = { id = "org.gradle.test-kit", version = "7.3.1" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
junit5Api = "org.junit.jupiter:junit-jupiter-api:5.14.4"
junit5Engine = "org.junit.jupiter:junit-jupiter-engine:5.14.4"
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinSerializationJson" }
